name: Kyushu Monthly ADS-B 2.5NM Heatmaps

on:
  workflow_dispatch:
    inputs:
      start_jst:
        description: "Start date JST (YYYY-MM-DD); one calendar month thereafter"
        required: true
        default: "2026-09-01"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      days: ${{ steps.dates.outputs.dates }}
      end: ${{ steps.dates.outputs.end }}
    steps:
      - uses: actions/checkout@v4
      - id: dates
        name: Validate month and plan dates
        env:
          START: ${{ inputs.start_jst }}
        run: python month_grid.py prepare --start "$START"

  daily:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        day: ${{ fromJson(needs.plan.outputs.days) }}
    env:
      ADSB_DATE_JST: ${{ matrix.day }}
      ADSB_INPUT_DIR: ${{ github.workspace }}/data
      ADSB_OUTPUT_DIR: ${{ github.workspace }}/results
    steps:
      - uses: actions/checkout@v4
      - name: Download archives for this JST date
        run: python download_release.py --date "$ADSB_DATE_JST" --directory "$ADSB_INPUT_DIR"
      - name: Parse historical positions into local SQLite
        run: python kyushu_continuity.py
      - name: Count daily flights per grid, altitude and hour
        run: python month_grid.py daily --day "$ADSB_DATE_JST" --db "$ADSB_OUTPUT_DIR/positions.sqlite" --out partial
      - name: Upload day partial (not the massive source archives)
        uses: actions/upload-artifact@v4
        with:
          name: monthly-day-${{ matrix.day }}
          path: partial/*.json.gz
          if-no-files-found: error
          retention-days: 14

  combine:
    needs: [plan, daily]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install raster dependencies
        run: python -m pip install pillow
      - name: Download all daily partials
        uses: actions/download-artifact@v4
        with:
          pattern: monthly-day-*
          path: partial
          merge-multiple: true
      - name: Merge month and create color maps
        env:
          START: ${{ inputs.start_jst }}
        run: python month_grid.py merge --start "$START" --partials partial --out month_results
      - name: Upload monthly result
        uses: actions/upload-artifact@v4
        with:
          name: monthly-kyushu-${{ inputs.start_jst }}
          if-no-files-found: error
          retention-days: 30
          path: month_results/
