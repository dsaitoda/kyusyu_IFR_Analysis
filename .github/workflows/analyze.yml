name: Kyushu ADS-B continuity + traffic maps

on:
  workflow_dispatch:
    inputs:
      date_jst:
        description: "Target JST date (YYYY-MM-DD)"
        required: true
        default: "2026-10-17"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ADSB_DATE_JST: ${{ inputs.date_jst }}
      ADSB_INPUT_DIR: ${{ github.workspace }}/data
      ADSB_OUTPUT_DIR: ${{ github.workspace }}/results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional plot library
        run: python -m pip install matplotlib
      - name: Run regression tests (synthetic data only)
        run: |
          python test_analyzer.py
          python test_download_release.py
          python test_kyushu_traffic.py
      - name: Download historical data for both UTC dates
        run: python download_release.py --date "$ADSB_DATE_JST" --directory "$ADSB_INPUT_DIR"
      - name: Analyze position continuity
        run: python kyushu_continuity.py
      - name: Export all low-altitude tracks, half-hour maps and density
        run: python kyushu_traffic.py --db "$ADSB_OUTPUT_DIR/positions.sqlite" --output "$ADSB_OUTPUT_DIR" --date "$ADSB_DATE_JST"
      - name: Build single KML for Google Earth Web
        run: python merge_web_kml.py --output "$ADSB_OUTPUT_DIR" --date "$ADSB_DATE_JST" --tolerance-nm 0.08
      - name: Upload compact analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyushu-continuity-${{ inputs.date_jst }}
          if-no-files-found: warn
          path: |
            results/summary.csv
            results/summary.txt
            results/gap_events.csv
            results/gap_points_below_10000ft.kml
            results/gap_histogram.png
            results/traffic_readme.txt
            results/traffic_density_5NM_0900_1700.png
            results/traffic_density_5NM_0900_1700.kml
            results/grid_5NM_0900_1700.csv
            results/time_slot_counts_0900_1700.csv
            results/kyushu_traffic_kml_bundle.zip
            results/all_tracks_below_13000ft.kml
            results/kyushu_web_onefile_*.kml
            results/web_kml_stats.txt
